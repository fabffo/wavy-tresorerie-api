spring:
  application:
    name: wavy-tresorerie-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${WAVY_TRESORERIE_DB_HOST:localhost}:${WAVY_TRESORERIE_DB_PORT:5436}/${WAVY_TRESORERIE_DB_NAME:wavy_tresorerie_db}
    username: ${WAVY_TRESORERIE_DB_USER:tresorerie_user}
    password: ${WAVY_TRESORERIE_DB_PASSWORD:tresorerie_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${WAVY_TRESORERIE_API_PORT:8086}

wavy:
  factures:
    api-url: ${WAVY_FACTURES_API_URL:http://localhost:8083}
  tiers:
    api-url: ${WAVY_TIERS_API_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
