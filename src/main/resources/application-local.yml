spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${WAVY_TRESORERIE_DB_HOST:localhost}:${WAVY_TRESORERIE_DB_PORT:5432}/${WAVY_TRESORERIE_DB_NAME:wavy_tresorerie_db}
    username: ${WAVY_TRESORERIE_DB_USER:tresorerie_user}
    password: ${WAVY_TRESORERIE_DB_PASSWORD:tresorerie_password}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
